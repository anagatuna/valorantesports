name: Sync de eventos

on:
  workflow_dispatch:
  schedule:
    # Cada 6h: los eventos cambian mucho menos que los partidos, y el enlace
    # de partidos nuevos lo recupera igual en la siguiente pasada.
    - cron: '0 */6 * * *'

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Sync de eventos y enlace con partidos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scrape_events.mjs
