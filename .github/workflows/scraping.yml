name: Clonador de Valorant

on:
  workflow_dispatch:      # Botón manual
  schedule:
    - cron: '*/30 * * * *' # Ejecutar cada 30 min

jobs:
  scrape-vlr:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      # ESTE PASO ES NUEVO: Ejecuta el scrape de equipos
      - name: Scrape Teams (Equipos)
        env: 
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scrape_teams.mjs

      # Tu script anterior (opcional, si quieres correr ambos)
      - name: Scrape Batch (Partidos)
        env: 
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scrape_batch.mjs