name: Clonador de Valorant

on:
  workflow_dispatch:
  schedule:
    # Cada 2 horas. Antes era */30, pero GitHub descarta los schedules de alta
    # frecuencia en el tier gratuito cuando hay carga: las corridas reales ya
    # venían saliendo cada 2-3 horas, así que pedir 30 min solo acumulaba
    # ejecuciones fantasma en la cola.
    - cron: '0 */2 * * *'

jobs:
  scrape-vlr:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      # Solo corremos el Batch, que ahora hace TODO (Partidos + Equipos)
      - name: Scrape Batch (Partidos y Equipos)
        env: 
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scrape_batch.mjs